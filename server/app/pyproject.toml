[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]"
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Tests import the package as `app` (matching the container's /src layout), so the
# parent directory must be on sys.path.
pythonpath = [".."]
testpaths = ["tests"]
