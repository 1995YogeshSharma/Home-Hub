[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
# Tests import the package as `app` (matching the container's /src layout), so the
# parent directory must be on sys.path.
pythonpath = [".."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused imports and variables, undefined names
    "I",        # import sorting
    "UP",       # pyupgrade: modern syntax for py3.14
    "B",        # bugbear: likely bugs
    "ASYNC",    # blocking calls inside async code
    "S",        # bandit: security checks
    "SIM",      # simplifications
    "RUF",      # ruff-specific checks
]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works; test fixtures contain dummy passwords
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pydantic.types.datetime" = { msg = "Use `from datetime import datetime`." }
"pydantic.types.ClassVar" = { msg = "Use `from typing import ClassVar`." }
"pydantic.types.Annotated" = { msg = "Use `from typing import Annotated`." }
"pydantic.networks.lru_cache" = { msg = "Use `from functools import lru_cache`." }
